# uv workspace root for running XLeRobot on top of a local lerobot checkout.
#
#   uv sync          # installs lerobot (editable, from ../lerobot) + the plugins
#   uv sync --extra mecanum --extra vr
#
# This project is virtual (`package = false`): it is never built or installed
# itself, it only declares what the environment should contain. The plugins
# under software/plugins/ are workspace members, so they install editable from
# this checkout.
#
# The important bit is [tool.uv.sources] below. Every plugin declares a
# dependency on `lerobot`, and a source at the workspace root applies to all
# members - so their `lerobot` resolves to the local fork rather than to the
# published package on PyPI. Without it, uv would install upstream lerobot
# alongside the fork and both would provide a `lerobot` module.

[project]
name = "xlerobot-env"
version = "0.0.0"
description = "Environment for Carl's XLeRobot: local lerobot fork plus the XLeRobot plugins"
# Pinned to 3.12 exactly, not just >=3.12. lerobot needs >=3.12, but on ARM
# pyrealsense2 publishes aarch64 wheels for cp39/cp310/cp312 only - no cp313,
# no cp314, and no sdist to build from. Without the upper bound uv selects the
# newest interpreter it can find and the RealSense install fails.
requires-python = ">=3.12,<3.13"

dependencies = [
    # The fork, with the extras this robot needs. Deliberately not `dataset`:
    # that pulls torchcodec, which on aarch64 needs >=0.11.0 and torch>=2.11.
    # Add it when you start recording.
    "lerobot[feetech,intelrealsense,viz]",

    # Shared SO101 kinematics, used by the robots and the examples.
    "xlerobot_model",

    # 3-omniwheel base (--robot.type=xlerobot / xlerobot_client).
    "lerobot_robot_xlerobot",

    # 2-wheel differential drive, Feetech servos
    # (--robot.type=xlerobot_2wheels / xlerobot_2wheels_client).
    "lerobot_robot_xlerobot_2wheels",

    # 2-wheel brushless base on an ODrive/ODESC over USB
    # (--robot.type=xlerobot_2wheels_odrive). The default base on this cart
    # since 2026-10-11; a subclass of the xlerobot robot above.
    "lerobot_robot_xlerobot_2wheels_odrive",

    # Leader arms + gamepad, presented to lerobot as a single teleoperator.
    # Used directly when everything is on one machine, and by the host half
    # of the remote pair below.
    "lerobot_teleoperator_xlerobot_leader_gamepad",

    # The same leaders and gamepad, served over the network. The cart runs
    # the robot, the cameras and the dataset; the operator station runs
    # leader_host.py and holds the physical leaders.
    "lerobot_teleoperator_xlerobot_leader_remote",
]

[project.optional-dependencies]
mecanum = ["lerobot_robot_xlerobot_mecanum"]
vr = ["lerobot_teleoperator_xlerobot_vr"]
dataset = ["lerobot[dataset]"]

# GPU torch for the Jetson:  uv sync --extra jetson
#
# On JetPack 7 the Orin uses the STOCK upstream aarch64 CUDA wheels - NVIDIA
# confirmed Orin can take the SBSA package, so the old ritual of hunting
# NVIDIA forum wheels is over, and the jetson-ai-lab jp6/cu126 index does
# NOT work here. cu132 matches elroy's CUDA 13.2 / driver 595.78 exactly.
#
# Why an EXTRA and not a marker: rosie is aarch64 linux too. No environment
# marker can tell a Jetson from a Raspberry Pi, so nothing uv can evaluate
# automatically will do it. Plain `uv sync` therefore gives CPU torch
# everywhere, and only elroy adds --extra jetson.
#
# Why declared here at all, rather than a `uv pip install` after syncing:
# `uv sync` makes the environment match the lock, so a hand-installed torch
# is silently replaced by the CPU build on the next sync - and nothing tells
# you. Inference just gets slow.
jetson = [
    "torch",
    "torchvision",
    # torchcodec is compiled against one torch release: 0.11 for torch 2.11,
    # 0.12 for 2.12. The lerobot fork allows <0.13 on ARM, but one resolution
    # serves rosie (PyPI torch 2.11) and elroy (cu132 torch 2.12) alike, and
    # uv kept 0.11.1 for both - which does not load against elroy's torch
    # ("Could not load libtorchcodec"). Pinning it here, in the extra that
    # already forks the resolution, gives the Jetson its own.
    "torchcodec>=0.12,<0.13 ; sys_platform == 'linux' and platform_machine == 'aarch64'",
]

[tool.uv]
# Virtual: declare the environment, don't build or install this directory.
package = false
# lerobot requires Python >=3.12, and on ARM pyrealsense2 has aarch64 wheels
# only up to cp312 (no cp313, no sdist). Let uv fetch its own interpreter
# rather than depend on whatever the system ships.
python-preference = "managed"

[tool.uv.workspace]
members = ["software/plugins/*"]

# odrive 0.5.4 is published as source only, and its setup.py imports its own
# native library to read its version - which refuses to load on macOS
# ("libfibre is not supported on your platform (Darwin arm64)"). uv has to
# run that setup.py just to learn odrive's dependencies, so `uv lock` failed
# on the Mac and could only be run on elroy. Stating the metadata here means
# uv never builds it to resolve. Read off the installed package on elroy,
# 2026-10-15: importlib.metadata.requires('odrive').
[[tool.uv.dependency-metadata]]
name = "odrive"
version = "0.5.4"
requires-dist = [
    "ipython",
    "PyUSB",
    "requests",
    "IntelHex",
    "matplotlib",
    "monotonic",
    "setuptools",
    "pywin32>=222; platform_system == 'Windows'",
]

[tool.uv.sources]
# The fork. Relative to this file, so it holds on any machine where the two
# repos are siblings. Override by moving the checkout, not by editing this.
lerobot = { path = "../lerobot", editable = true }

# Only when --extra jetson is on; otherwise torch comes from PyPI (CPU).
#
# The aarch64 marker is NOT redundant. The fork's own pyproject routes torch
# to cu128 on x86_64 linux, and those sources ARE read here - without the
# marker both entries claim torch on that platform and uv refuses to resolve
# at all:
#
#   Requirements contain conflicting indexes for package `torch` in split
#   `... platform_machine == 'x86_64' and sys_platform == 'linux'`:
#   https://download.pytorch.org/whl/cu128 / .../cu132
#
# Scoping leaves x86_64 to the fork's entry and says what is true anyway:
# this extra exists for the Jetson.
#
# sys_platform is in the marker too, not just the machine. uv resolves for
# EVERY environment it can imagine unless told otherwise, including
# aarch64 Windows - which nobody will ever run this on, but where a
# machine-only marker handed torch to cu132 while the fork's non-ARM pin
# applied, and the lock failed on a platform that does not exist:
#
#   No solution found ... for split (markers: platform_machine == 'aarch64'
#   and sys_platform == 'win32')
torch = [{ index = "pytorch-cu132", extra = "jetson", marker = "sys_platform == 'linux' and platform_machine == 'aarch64'" }]
torchvision = [{ index = "pytorch-cu132", extra = "jetson", marker = "sys_platform == 'linux' and platform_machine == 'aarch64'" }]

# Plugins resolve from this workspace rather than from an index.
xlerobot_model = { workspace = true }
lerobot_robot_xlerobot = { workspace = true }
lerobot_robot_xlerobot_2wheels = { workspace = true }
lerobot_robot_xlerobot_mecanum = { workspace = true }
lerobot_teleoperator_xlerobot_vr = { workspace = true }
lerobot_robot_xlerobot_2wheels_odrive = { workspace = true }
lerobot_teleoperator_xlerobot_leader_gamepad = { workspace = true }
lerobot_teleoperator_xlerobot_leader_remote = { workspace = true }

# explicit = true keeps this index to the packages pinned to it above,
# rather than letting it answer for everything.
[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true
